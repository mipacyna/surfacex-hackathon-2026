resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    client_max_body_size 25m;
    root /usr/share/nginx/html;

    # Prefer a clear maintenance page over raw "502 Bad Gateway".
    error_page 502 503 504 =503 /maintenance.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /maintenance.html {
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
    }

    # Worker callbacks are backend-network only and must never be exposed publicly.
    location ^~ /api/internal/ {
        return 404;
    }

    location /api/ {
        set $api_host api;
        proxy_pass http://$api_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Sessionid $http_x_sessionid;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Retry-After 30 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"Technical break. Please try again shortly."}';
    }

    location /admin/ {
        set $api_host api;
        proxy_pass http://$api_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        error_page 502 503 504 =503 /maintenance.html;
    }

    location / {
        set $web_host web;
        proxy_pass http://$web_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        error_page 502 503 504 =503 /maintenance.html;
    }
}
