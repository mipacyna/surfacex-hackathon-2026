<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>SurfaceX — przerwa techniczna</title>
    <style>
      :root {
        --nav: #232f3e;
        --bg: #eaeded;
        --panel: #ffffff;
        --border: #aab7b8;
        --text: #16191f;
        --muted: #545b64;
        --orange: #ec7211;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 15px;
        line-height: 1.45;
        color: var(--text);
        background: var(--bg);
        display: grid;
        grid-template-rows: 40px 1fr;
        min-height: 100vh;
      }
      .top {
        background: var(--nav);
        color: #fff;
        display: flex;
        align-items: center;
        padding: 0 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .top span {
        color: var(--orange);
        margin-right: 8px;
      }
      main {
        display: grid;
        place-items: center;
        padding: 32px 16px;
      }
      .card {
        width: min(520px, 100%);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 2px;
        padding: 28px 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 700;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
      }
      .en {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 13px;
      }
      button {
        margin-top: 8px;
        appearance: none;
        border: 1px solid var(--orange);
        background: var(--orange);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 8px 14px;
        border-radius: 2px;
        cursor: pointer;
      }
      button:hover {
        background: #eb5f07;
        border-color: #eb5f07;
      }
    </style>
  </head>
  <body>
    <header class="top"><span>■</span> SurfaceX</header>
    <main>
      <section class="card" role="status" aria-live="polite">
        <h1>Technical break</h1>
        <p>
          SurfaceX is temporarily unavailable due to maintenance or a service
          restart. Please try again in a moment.
        </p>
        <button type="button" onclick="location.reload()">Reload page</button>
      </section>
    </main>
  </body>
</html>
