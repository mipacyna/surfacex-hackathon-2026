server {
  listen 80;
  listen 8443;
  add_header X-Environment 'staging' always;
  add_header X-App-Version '2.4.0-rc1' always;
  add_header X-Debug-Mode 'enabled' always;
  location / { default_type text/html; return 200 '<!doctype html><html><head><meta charset="utf-8"><title>Staging – Student Portal v2.4.0-rc1 (DEBUG)</title></head><body><div>DEBUG MODE</div></body></html>'; }
}
