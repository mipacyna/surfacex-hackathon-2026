server {
  listen 80;
  server_tokens on;
  root /usr/share/nginx/html;
  add_header Link '<http://10.77.0.10/wp-json/>; rel="https://api.w.org/"' always;
  add_header X-Pingback 'http://10.77.0.10/xmlrpc.php' always;
  location = /wp-login.php { default_type text/html; return 200 '<html><title>Log In &lsaquo; Faculty Demo</title><body>wp-login</body></html>'; }
  location / { index index.html; }
}
